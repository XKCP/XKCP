name: XKCP CI

# Run this workflow every time a new commit pushed to your repository
on: push

jobs:
  permutations_different_low_level_implementations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Build and test
        id: build-image
        env:
          CI_VERBOSE: 1
          # For now, platforms other than x86 and ARM are not activated in the CI
          # (this concerns mips(el),mips64(el), sparc64, riscv64)
          # This is not active as XKCP endianness and memory alignment issues must
          # be resolved in all the low-level layers: once done, this environment
          # variable can be set to 1.
          OTHER_PLATFORMS: 0
        run: |
          make -f Makefile.ci

  all_generic64_implementation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: sudo apt-get install -y xsltproc

      - name: Build Unit Tests
        run: make generic64/UnitTests

      - name: Run Unit Tests
        run: bin/generic64/UnitTests -a

  all_x86-64_implementation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: sudo apt-get install -y xsltproc

      - name: Build x86-64 Unit Tests
        run: make x86-64/UnitTests

      - name: Run x86-64 Unit Tests
        run: bin/x86-64/UnitTests -a

      - name: Run x86-64 Unit Tests with AVX512 disabled
        run: bin/x86-64/UnitTests -a --disableAVX512

      - name: Run x86-64 Unit Tests with AVX2 disabled
        run: bin/x86-64/UnitTests -a --disableAVX512 --disableAVX2

      - name: Run x86-64 Unit Tests with SSSE3 disabled
        run: bin/x86-64/UnitTests -a --disableAVX512 --disableAVX2 --disableSSSE3

  # Misaligned caller buffers, with the UBSan alignment check: the
  # misaligned-buffer test and the unit tests (see
  # tests/MemoryAlignment/run.sh), on each CPU dispatch path of the
  # x86-64 and aarch64 targets. Hosted x86-64 runners do not guarantee
  # AVX-512, so the first x86-64 leg can test the AVX2 code instead.
  memory_alignment:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86-64, options: "" }
          - { runner: ubuntu-latest, target: x86-64, options: "--disableAVX512" }
          - { runner: ubuntu-latest, target: x86-64, options: "--disableAVX512 --disableAVX2" }
          - { runner: ubuntu-latest, target: x86-64, options: "--disableAVX512 --disableAVX2 --disableSSSE3" }
          - { runner: ubuntu-24.04-arm, target: aarch64, options: "" }
          - { runner: ubuntu-24.04-arm, target: aarch64, options: "--disableSHA3" }
    env:
      COMPILER: gcc
      WITH_UNITTESTS: 1

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xsltproc

      - name: Run the misaligned-buffer test and the unit tests
        env:
          TARGET: ${{ matrix.target }}
          OPTIONS: ${{ matrix.options }}
        run: |
          # OPTIONS is split into words on purpose.
          # shellcheck disable=SC2086
          tests/MemoryAlignment/run.sh . "$TARGET" $OPTIONS
